[pytest]
# Pytest configuration for TikTok viral fashion scraper

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Show summary of all test outcomes
    -ra
    # Enable strict markers
    --strict-markers
    # Coverage options
    --cov=models
    --cov=analyzer
    --cov=scraper
    --cov-report=html
    --cov-report=term-missing
    # Fail if coverage is below threshold
    --cov-fail-under=80

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for combined functionality
    slow: Tests that take longer to run
    models: Tests for data models
    detector: Tests for viral detection
    fashion: Tests for fashion extraction
    edge_case: Tests for edge cases and error conditions

# Minimum Python version
minversion = 3.8

# Console output options
console_output_style = progress

# Log settings
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Asyncio mode for async tests
asyncio_mode = auto
